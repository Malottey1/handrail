[project]
name = "handrail-core"
version = "0.1.0"
description = "Shared client for Handrail's tool-call API, used by handrail-langchain and handrail-crewai."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

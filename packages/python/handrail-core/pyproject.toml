[project]
name = "handrail-core"
version = "0.1.0"
description = "Shared client for Handrail's tool-call API, used by handrail-langchain and handrail-crewai."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

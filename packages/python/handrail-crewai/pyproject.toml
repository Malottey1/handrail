[project]
name = "handrail-crewai"
version = "0.1.0"
description = "PayPal's Agent Toolkit tools for CrewAI, with every call going through Handrail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["handrail-core>=0.1,<0.2", "crewai>=0.80"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

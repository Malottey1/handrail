# Runs on every push and pull request: no secrets anywhere in the history, and
# the tests (including the ones that fail if redaction is removed) pass.
name: Secrets and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Handrail secret check (all tracked files)
        run: node scripts/check-secrets.mjs --all
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/python/handrail-core -e packages/python/handrail-langchain "langchain==0.3.23" pytest
      - run: python -m pytest packages/python/tests   # the CrewAI test is skipped here (CrewAI is a large install)

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run typecheck && npm test
        working-directory: packages/typescript
      - name: Committed dist/ matches the source
        run: npm run build && git diff --exit-code -- handrail-ai-sdk/dist handrail-langchain/dist
        working-directory: packages/typescript

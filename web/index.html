<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/handrail-logo.png" />
    <link rel="apple-touch-icon" href="/handrail-logo.png" />
    <meta name="theme-color" content="#127842" />
    <meta name="description" content="Handrail is a drop-in safety layer for PayPal's Agent Toolkit: limits, human approval, idempotency and an audit trail for every money-moving call your AI agent makes." />
    <title>Handrail</title>
    <script>
      // Apply the saved theme before first paint (light by default).
      try { if (localStorage.getItem("handrail.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
